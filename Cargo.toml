[package]
name = "starboard"
version = "0.1.0"
edition = "2024"

[dependencies]
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-mention = "0.17.0"
twilight-model = "0.17.1"
twilight-standby = "0.17.0"
twilight-util = { version = "0.17.0", features = ["builder", "snowflake"] }
twilight-validate = "0.17.0"

twilight-interactions = "0.17.0"

async-trait = "0.1.89"
cached = "0.56.0"
chrono = "0.4.42"
dashmap = "6.1.0"
dotenv = "0.15.0"
emojis = "0.8.0"
floodgate = "0.5.1"
futures = "0.3.31"
humantime = "2.3.0"
moka = { version = "0.11.3", features = ["future"] }
psutil = "3.3.0"
regex = "1.12.2"
reqwest = { version = "0.12.25", default-features = false, features = [
  "json",
  "rustls-tls"
] }
rust-fuzzy-search = "0.1.1"
rustls = { version = "0.23.35" }
serde = "1.0.228"
serde_json = "1.0"
serde_with = "3.16.1"
snafu = { version = "0.8.9", features = ["backtraces-impl-backtrace-crate"] }
sqlx = { version = "0.8.6", features = [
  "chrono",
  "json",
  "macros",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs"
] }
thousands = "0.2.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-segmentation = "1.13.2"
