[package]
name = "starboard"
version = "0.1.0"
edition = "2024"

[dependencies]
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-mention = "0.17.0"
twilight-model = "0.17.1"
twilight-standby = "0.17.0"
twilight-util = { version = "0.17.0", features = ["builder", "snowflake"] }
twilight-validate = "0.17.0"

twilight-interactions = "0.17.1"

async-trait = "0.1.91"
cached = "2.0.2"
chrono = "0.4.45"
dashmap = "6.2.1"
dotenv = "0.15.0"
emojis = "0.9.0"
floodgate = "0.5.1"
futures = "0.3.33"
humantime = "2.4.0"
moka = { version = "0.12.15", features = ["future"] }
psutil = { version = "5.4.0", default-features = false, features = [
  "cpu",
  "memory"
] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls"
] }
rust-fuzzy-search = "0.1.1"
serde = "1.0.229"
serde_json = "1.0"
serde_with = "3.21.0"
snafu = { version = "0.9.2", features = ["backtraces-impl-backtrace-crate"] }
sqlx = { version = "0.9.0", features = [
  "chrono",
  "json",
  "macros",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs"
] }
thousands = "0.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
