[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "end-of-file-fixer" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "mixed-line-ending" },
  { id = "check-symlinks" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v0.9.6"
hooks = [
  { id = "tombi-format", exclude = { glob = "Cargo.lock" } },
  { id = "tombi-lint", exclude = { glob = "Cargo.lock" } },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
language = "system"
entry = "cargo +nightly fmt"
types = ["rust"]
pass_filenames = false
